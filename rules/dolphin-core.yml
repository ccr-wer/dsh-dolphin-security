- id: javascript_buf_rule-buffer-noassert-read
  patterns:
  - pattern: $OBJ.$METHOD(..., true)
  - metavariable-regex:
      metavariable: $METHOD
      regex: ^(readUInt8|readUInt16LE|readUInt16BE|readUInt32LE|readUInt32BE|readUInt32BE|readInt8|readInt16LE|readInt16BE|readInt32LE|readInt32BE|readFloatLE|readFloatBE|readDoubleLE|readDoubleBE)$
  severity: WARNING
  languages:
  - javascript
  metadata:
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    cwe: CWE-125
    shortDescription: Out-of-bounds read
    security-severity: MEDIUM
    category: security
    source-rule-url: https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-buffer-noassert.js
    dolphin_source_file: javascript/buf/rule-buffer-noassert-read.yml
    license: MIT
  message: "The application is using Buffer API methods with the `noAssert` \nparameter set to `true` for the read buffer methods. This disables \nthe bounds checking and could result in reading beyond the end of \nthe buffer, leading to potential memory corruption and security \nvulnerabilities. When `noAssert` is set to `true`, the methods \ndo not perform bounds checking, allowing the offset to be beyond \nthe end of the buffer. This can lead to out-of-bounds memory access, \ncausing undefined behavior, crashes, or potential security exploits.\n\nTo mitigate the issue, ensure that the `noAssert` parameter is not \nset to `true`. Always use bounds checking to prevent out-of-bounds \nmemory access. Validate the offset before performing read operations \non the buffer.\n\nSecure Code Example:\n```\n  const buffer = Buffer.alloc(10); // Allocate a buffer of 10 bytes\n\n  function safeBufferMethods(buf) {\n    const safeOffset = 5; // An offset within the bounds of the buffer\n\n    // Secure read methods\n    if (safeOffset < buf.length) {\n      buf.readUInt8(safeOffset);\n      buf.readUInt16LE(safeOffset);\n      buf.readUInt16BE(safeOffset);\n      buf.readUInt32LE(safeOffset);\n      buf.readUInt32BE(safeOffset);\n      buf.readInt8(safeOffset);\n      buf.readInt16LE(safeOffset);\n      buf.readInt16BE(safeOffset);\n      buf.readInt32LE(safeOffset);\n      buf.readInt32BE(safeOffset);\n      buf.readFloatLE(safeOffset);\n      buf.readFloatBE(safeOffset);\n      buf.readDoubleLE(safeOffset);\n      buf.readDoubleBE(safeOffset);\n    }\n  }\n  try {\n    safeBufferMethods(buffer);\n  } catch (error) {\n    console.error('Caught an error:', error);\n  }\n```\n"
- id: javascript_buf_rule-buffer-noassert-write
  patterns:
  - pattern: $OBJ.$METHOD(..., true)
  - metavariable-regex:
      metavariable: $METHOD
      regex: ^(writeUInt8|writeUInt16LE|writeUInt16BE|writeUInt32LE|writeUInt32BE|writeInt8|writeInt16LE|writeInt16BE|writeInt32LE|writeInt32BE|writeFloatLE|writeFloatBE|writeDoubleLE|writeDoubleBE)$
  severity: WARNING
  languages:
  - javascript
  metadata:
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    cwe: CWE-787
    shortDescription: Out-of-bounds write
    security-severity: MEDIUM
    category: security
    source-rule-url: https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-buffer-noassert.js
    dolphin_source_file: javascript/buf/rule-buffer-noassert-write.yml
    license: MIT
  message: "The application is using Buffer API methods with the `noAssert` \nparameter set to `true` for the write buffer methods. This disables \nthe bounds checking and could result in writing beyond the end of \nthe buffer, leading to potential memory corruption and security \nvulnerabilities. When `noAssert` is set to `true`, the methods \ndo not perform bounds checking, allowing the offset to be beyond \nthe end of the buffer. This can lead to out-of-bounds memory access, \ncausing undefined behavior, crashes, or potential security exploits.\n\nTo mitigate the issue, ensure that the `noAssert` parameter is not \nset to `true`. Always use bounds checking to prevent out-of-bounds \nmemory access. Validate the offset before performing write operations \non the buffer.\n\nSecure Code Example:\n```\n  const buffer = Buffer.alloc(10); // Allocate a buffer of 10 bytes\n\n  function safeBufferMethods(buf) {\n    const safeOffset = 5; // An offset within the bounds of the buffer\n\n    // Secure write methods\n    if (safeOffset < buf.length) {\n      buf.writeUInt8(0, safeOffset);\n      buf.writeUInt16LE(0, safeOffset);\n      buf.writeUInt16BE(0, safeOffset);\n      buf.writeUInt32LE(0, safeOffset);\n      buf.writeUInt32BE(0, safeOffset);\n      buf.writeInt8(0, safeOffset);\n      buf.writeInt16LE(0, safeOffset);\n      buf.writeInt16BE(0, safeOffset);\n      buf.writeInt32LE(0, safeOffset);\n      buf.writeInt32BE(0, safeOffset);\n      buf.writeFloatLE(0, safeOffset);\n      buf.writeFloatBE(0, safeOffset);\n      buf.writeDoubleLE(0, safeOffset);\n      buf.writeDoubleBE(0, safeOffset);\n    }\n  }\n\n  try {\n    safeBufferMethods(buffer);\n  } catch (error) {\n    console.error('Caught an error:', error);\n  }\n```\n"
- id: javascript_buf_rule-detect-new-buffer
  languages:
  - javascript
  - typescript
  patterns:
  - patterns:
    - pattern-not-inside: 'require("safe-buffer")

        ...'
    - pattern-not-inside: 'import { Buffer } from "safe-buffer"

        ...'
    - pattern-inside: function $FUNC(..., $X, ...) { ... }
    - pattern: new Buffer($X,...)
  - pattern-not: 'new Buffer("...",...)

      '
  - pattern-not: 'new Buffer([...] , ...)

      '
  message: 'The application was found calling  the `new Buffer` constructor which has been deprecated

    since Node 8.

    By passing in a non-literal value, an adversary could allocate large amounts of memory.


    Other issues also exist with the `Buffer` constructor:

    - Older versions would return uninitialized memory, which could contain sensitive information

    - Unable to easily determine what a Buffer contained if passed a non-literal value


    To remediate this issue, use `Buffer.alloc` or `Buffer.from` instead to allocate a new

    `Buffer`.


    Example using `Buffer.alloc` instead of `new Buffer(...)`:

    ```

    // Create a new buffer using Buffer.from

    const buf = Buffer.from([1, 2, 3, 4]);

    // Work with buf

    ```


    For more information on migrating to `Buffer.from()`/`Buffer.alloc()` see:

    - https://nodejs.org/en/docs/guides/buffer-constructor-deprecation

    '
  metadata:
    shortDescription: Allocation of resources without limits or throttling
    cwe: CWE-770
    category: security
    owasp:
    - A9:2017-Using Components with Known Vulnerabilities
    - A06:2021-Vulnerable and Outdated Components
    source-rule-url: https://github.com/eslint-community/eslint-plugin-security/blob/main/rules/detect-new-buffer.js
    security-severity: Medium
    dolphin_source_file: javascript/buf/rule-detect-new-buffer.yml
    license: MIT
  severity: WARNING
- id: javascript_dos_rule-non-literal-regexp
  languages:
  - javascript
  - typescript
  pattern-either:
  - patterns:
    - pattern: 'new RegExp(...)

        '
    - pattern-not: 'new RegExp("...", ...)

        '
    - pattern-not: 'new RegExp(/.../, ...)

        '
  - patterns:
    - pattern: 'RegExp(...)

        '
    - pattern-not: 'RegExp("...", ...)

        '
    - pattern-not: 'RegExp(/.../, ...)

        '
  - patterns:
    - pattern: '"...".$METHOD(...)

        '
    - pattern-not: '"...".$METHOD("...")

        '
    - pattern-not: '"...".$METHOD(/.../)

        '
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(match|search)$
  message: "The `RegExp` constructor was called with a non-literal value. If an adversary were able to\nsupply a malicious regex, they could cause a Regular Expression Denial of Service (ReDoS)\nagainst the application. In Node applications, this could cause the entire application to no\nlonger be responsive to other users' requests.\n\nTo remediate this issue, never allow user-supplied regular expressions. Instead, the regular \nexpression should be  hardcoded. If this is not possible, consider using an alternative regular\nexpression engine such as [node-re2](https://www.npmjs.com/package/re2). RE2 is a safe alternative \nthat does not support backtracking, which is what leads to ReDoS.\n\nExample using re2 which does not support backtracking (Note: it is still recommended to\nnever use user-supplied input):\n```\n// Import the re2 module\nconst RE2 = require('re2');\n\nfunction match(userSuppliedRegex, userInput) {\n    // Create a RE2 object with the user supplied regex, this is relatively safe\n    // due to RE2 not supporting backtracking which can be abused to cause long running\n    // queries\n    var re = new RE2(userSuppliedRegex);\n    // Execute the regular expression against some userInput\n    var result = re.exec(userInput);\n    // Work with the result\n}\n```\n\nFor more information on Regular Expression DoS see:\n- https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS\n"
  metadata:
    cwe: CWE-185
    shortDescription: Regular expression with non-literal value
    category: security
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    security-severity: Medium
    dolphin_source_file: javascript/dos/rule-non-literal-regexp.yml
    license: MIT
  severity: WARNING
