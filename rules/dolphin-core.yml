  - pattern: 'UsmUserData(..., privProtocol=(1,3,6,1,6,3,10,1,2,1), ...)

      '
  - patterns:
    - pattern-not: 'UsmUserData($NAME,$AUTHKEY,"...", ...)

        '
    - pattern-not: 'UsmUserData(..., privKey=$PRIVKEY, ...)

        '
    - pattern-not: 'UsmUserData(..., privProtocol=$PRIVPROT, ...)

        '
    - pattern: 'UsmUserData(...)

        '
  severity: WARNING
- id: python_sql_rule-hardcoded-sql-expression
  languages:
  - python
  message: 'SQL Injection is a critical vulnerability that can lead to data or system compromise. By

    dynamically generating SQL query strings, user input may be able to influence the logic of

    the SQL statement. This could lead to an adversary accessing information they should

    not have access to, or in some circumstances, being able to execute OS functionality or code.


    Replace all dynamically generated SQL queries with parameterized queries. In situations where

    dynamic queries must be created, never use direct user input, but instead use a map or

    dictionary of valid values and resolve them using a user supplied key.


    For example, some database drivers do not allow parameterized queries for `>` or `<` comparison

    operators. In these cases, do not use a user supplied `>` or `<` value, but rather have the

    user

    supply a `gt` or `lt` value. The alphabetical values are then used to look up the `>` and `<`

    values to be used in the construction of the dynamic query. The same goes for other queries

    where

    column or table names are required but cannot be parameterized.


    Example using `PreparedStatement` queries:

    ```

    import sqlite3


    # Create a new database (in memory)

    con = sqlite3.connect(":memory:")

    # Get a cursor from the connection

    cur = con.cursor()

    # Create a tuple of the value to be used in the parameterized query

    params = (''user-input'',)

    # execute the statement, passing in the params for the value

    cur.execute("select name from sqlite_master where name = ?", params)

    # work with the result

    result = cur.fetchall()

    ```


    For more information on SQL Injection see OWASP:

    https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html

    '
  metadata:
    cwe: CWE-89
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    category: security
    shortDescription: Improper neutralization of special elements used in an SQL Command ('SQL Injection')
    security-severity: High
    dolphin_source_file: python/sql/rule-hardcoded-sql-expression.yml
    license: MIT
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: '"$QUERY" % ...

          '
      - pattern: '"$QUERY".format(...)

          '
      - pattern: 'f"$QUERY{...}..."

          '
      - pattern: '"$QUERY" + ...

          '
      - pattern: '$TMP = "$QUERY"

          ...

          $SQL = $TMP + "..." % ...

          '
      - pattern: "$SQL = \"$QUERY\"\n...\n$SQL += ...              \n"
    - metavariable-regex:
        metavariable: $QUERY
        regex: (?i)^(SELECT|INSERT|UPDATE|DELETE)\s
  pattern-sinks:
  - patterns:
    - pattern: $DB.execute(...)
    - pattern-not:
        pattern-either:
        - pattern: $DB.execute("...")
        - pattern: $DB.execute("$QUERY" % "...")
        - pattern: $DB.execute("$QUERY" + "...")
  severity: WARNING
- id: python_ssh_rule-ssh-nohost-key-verification
  languages:
  - python
  message: "The application was found to ignore host keys. Host keys are important as\nthey provide assurance that the client can prove that the host is trusted.\nBy ignoring these host keys, it is impossible for the client to validate the\nconnection is to a trusted host.\n\nTo remediate this issue, remove the call to `set_missing_host_key_policy(...)` which\nsets the host key policy. Instead, load key files using either `load_system_host_keys`\nor `load_host_keys` to only allow known good hosts. By not setting a host key policy\nfor unknown hosts, `paramiko`'s default policy is to use `RejectPolicy`.\n\nExample configuration connecting to a known, trusted host, and not allowing connections\nto unknown hosts:\n```\nimport paramiko\n\n# Create an SSH client\nwith paramiko.SSHClient() as ssh:\n    # Load the system host keys so we can confirm the\n    # host we are connecting to is legitimate\n    ssh.load_system_host_keys('/home/appuser/.ssh/known_hosts')\n\n    # Connect to the remote host using our SSH private key\n    ssh.connect(hostname='example.org',\n                port=22,\n                username='appuser',\n                key_filename='/home/appuser/.ssh/private_key')\n```\n\nFor more information on `set_missing_host_key_policy` see:\n- https://docs.paramiko.org/en/stable/api/client.html#paramiko.client.SSHClient.set_missing_host_key_policy\n"
  metadata:
    cwe: CWE-322
    category: security
    owasp:
    - A2:2017-Broken Authentication
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    shortDescription: Key exchange without entity authentication
    security-severity: Medium
    dolphin_source_file: python/ssh/rule-ssh-nohost-key-verification.yml
    license: MIT
  patterns:
  - pattern-inside: '$CLIENT = paramiko.client.SSHClient(...)

      ...

      $CLIENT.set_missing_host_key_policy(...)

      '
  - pattern-either:
    - pattern: paramiko.client.AutoAddPolicy
    - pattern: paramiko.client.WarningPolicy
  severity: ERROR
- id: python_ssl_rule-req-no-certvalid
  languages:
  - python
  message: 'The application was found using the `requests` module without configuring a timeout value for

    connections. The `verify=False` argument has been set, which effectively disables the

    validation

    of server certificates.


    This allows for an adversary who is in between the application and the target host to intercept

    potentially sensitive information or transmit malicious data.


    To remediate this issue either remove the `verify=False` argument, or set `verify=True`to each

    `requests` call.


    Example verifying server certificates for an HTTP GET request:

    ```

    # Issue a GET request to https://example.com with a timeout of 10 seconds and verify the

    # server certificate explicitly.

    response = requests.get(''https://example.com'', timeout=10, verify=True)

    # Work with the response object

    # ...

    ```


    For more information on using the requests module see:

    - https://requests.readthedocs.io/en/latest/api/

    '
  metadata:
    cwe: CWE-295
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A07:2021-Identification and Authentication Failures
    - A07:2025-Authentication Failures
